name: Rust

on:
  push:
    branches: [main, rust]
    paths: ["rust/**", "config.example.toml", "profiles/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "config.example.toml", "profiles/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Build ReadyTrans.exe
        run: cargo build --release

      - name: Self-test the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/readytrans.exe dist/ReadyTrans.exe
          $p = Start-Process dist/ReadyTrans.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content dist/selftest.log -Encoding utf8
          Get-Content dist/readytrans.log -Encoding utf8
          if ($p.ExitCode -ne 0) { exit 1 }
          "サイズ: {0:N1} MB" -f ((Get-Item dist/ReadyTrans.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ReadyTrans-rust
          path: rust/dist/ReadyTrans.exe
