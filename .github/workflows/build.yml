name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Releases に公開するときのタグ名（例: v0.1.0）。空ならビルドだけ"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Test
        run: uv run pytest -q

      - name: Build ReadyTrans.exe
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process dist/ReadyTrans.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content dist/selftest.log -Encoding utf8
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ReadyTrans
          path: dist/ReadyTrans.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/ReadyTrans.exe
          generate_release_notes: true
