name: Build

on:
  push:
    branches: [main, rust]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Releases に公開するときのタグ名（例: v0.2.0）。空ならビルドだけ"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Build ReadyTrans.exe
        run: cargo build --release

      - name: Self-test the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/readytrans.exe dist/ReadyTrans.exe
          $p = Start-Process dist/ReadyTrans.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content dist/selftest.log -Encoding utf8
          Get-Content dist/readytrans.log -Encoding utf8
          if ($p.ExitCode -ne 0) { exit 1 }
          "サイズ: {0:N1} MB" -f ((Get-Item dist/ReadyTrans.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ReadyTrans
          path: dist/ReadyTrans.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/ReadyTrans.exe
          generate_release_notes: true
